<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sky · 燃 · 梦 - 小本本</title>
    <link rel="icon" type="image/ico" href="img/icon.png">
    <link rel="stylesheet" href="css/index.css">
    <style>
        @font-face {
            font-family: "DIY font";
            src: url("https://cdn.jsdelivr.net/gh/xiaoyanu/file-test@2021.12.20/more/HarmonyOS_Sans_SC_Medium.subset.woff2") format("truetype");
        }
        * { margin: 0; padding: 0; font-family: "DIY font"; }
        body {
            background: url(img/bg.jpg) fixed no-repeat;
            background-size: cover;
            font-size: 18px;
            min-height: 100vh;
        }
        ::-webkit-scrollbar { width: 0px; height: 0px; }
        #box {
            margin: 5% auto;
            width: 800px;
            max-height: 80vh;
            backdrop-filter: blur(10px);
            background-color: rgba(255,255,255,0.2);
            border-radius: 20px;
            border: rgba(255,255,255,0.4) 1px solid;
            text-shadow: 0 0 15px rgb(0 0 0 / 50%);
            box-shadow: 1px 1px 10px rgb(0 0 0 / 50%);
            overflow-y: auto;
            padding: 20px;
        }
        .entry {
            background: rgba(255,255,255,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .entry:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .entry-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
        }
        .entry-content {
            color: #fff;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .entry-content img { max-width: 100%; border-radius: 8px; margin: 10px 0; }
        .empty-msg {
            color: #fff;
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
        }
        #footer {
            text-align: center;
            color: #fff;
            padding: 20px;
            margin-top: -20px;
        }
        #backhome {
            display: inline-block;
            color: black;
            text-decoration: none;
            border: black 1px solid;
            border-radius: 10px;
            width: 80px;
            font-size: 16px;
            line-height: 20px;
            height: 20px;
            text-align: center;
            margin-left: 20px;
            background: rgba(255,255,255,0.5);
        }
        #backhome:hover { color: white; background-color: black; transition: all 0.5s; }
        @media only screen and (max-width: 639px) {
            #box { width: 85%; margin: 20% auto; }
            body { background-image: url(img/bg3.jpg); }
        }
    </style>
</head>
<body>
    <div id="box"></div>
    <div id="footer">
        小本本 · 记录点点滴滴
        <a id="backhome" href="index.html">返回首页</a>
    </div>
    <script>
    fetch('data/text/index.json')
        .then(r => r.json())
        .then(entries => {
            const box = document.getElementById('box');
            if (entries.length === 0) {
                box.innerHTML = '<div class="empty-msg">📝 还没有记录，快去 data/text/ 目录添加吧</div>';
                return;
            }
            entries.slice().reverse().forEach(entry => {
                const div = document.createElement('div');
                div.className = 'entry';
                const name = entry.filename.replace(/\.(txt|md)$/i, '');
                div.innerHTML = '<div class="entry-title">📄 ' + name + '</div>' +
                    '<div class="entry-content">' + escapeHtml(entry.content) + '</div>';
                box.appendChild(div);
            });
        });
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    </script>
</body>
</html>
