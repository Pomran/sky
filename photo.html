<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Sky · 燃 · 梦 - 相册</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="icon" type="image/ico" href="img/icon.png">
	<style>
		@font-face {
			font-family: "DIY font";
			src: url("https://cdn.jsdelivr.net/gh/xiaoyanu/file-test@2021.12.20/more/HarmonyOS_Sans_SC_Medium.subset.woff2") format("truetype");
		}
		* { margin: 0; padding: 0; box-sizing: border-box; font-family: "DIY font"; }
		body {
			background: url(img/bg.jpg) fixed no-repeat;
			background-size: cover;
			min-height: 100vh;
		}
		#header {
			text-align: center;
			padding: 20px;
			color: #fff;
			text-shadow: 0 2px 10px rgba(0,0,0,0.5);
		}
		#header h1 { font-size: 1.5em; }
		#backhome {
			display: inline-block;
			color: #fff;
			text-decoration: none;
			border: 1px solid rgba(255,255,255,0.4);
			border-radius: 20px;
			padding: 4px 20px;
			font-size: 0.85em;
			margin-left: 10px;
			background: rgba(255,255,255,0.1);
			transition: all 0.3s;
		}
		#backhome:hover { color: #000; background: #fff; }
		#main {
			max-width: 1200px;
			margin: 0 auto;
			padding: 10px;
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
			gap: 10px;
		}
		.thumb {
			border-radius: 12px;
			overflow: hidden;
			position: relative;
			aspect-ratio: 1;
			backdrop-filter: blur(5px);
			background: rgba(255,255,255,0.1);
			border: 1px solid rgba(255,255,255,0.2);
			opacity: 0;
			transform: translateY(10px);
			transition: opacity 0.4s, transform 0.4s;
		}
		.thumb.loaded {
			opacity: 1;
			transform: translateY(0);
		}
		.thumb a { display: block; width: 100%; height: 100%; cursor: zoom-in; }
		.thumb img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}
		#footer {
			text-align: center;
			color: #fff;
			padding: 20px;
		}
		@media only screen and (max-width: 639px) {
			body { background-image: url(img/bg3.jpg); }
			#main { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 5px; padding: 5px; }
		}
	</style>
</head>
<body>
	<div id="header">
		<h1>📷 我们的相册 <a id="backhome" href="index.html">返回首页</a></h1>
	</div>
	<div id="main"></div>
	<div id="footer">Sky · 燃 · 梦</div>
	<script>
	function imgUrl(name) { return 'data/images/' + encodeURIComponent(name); }

	fetch('data/images/index.json')
		.then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
		.then(images => {
			const main = document.getElementById('main');
			images.slice().reverse().forEach((img, i) => {
				const article = document.createElement('div');
				article.className = 'thumb';
				article.style.transitionDelay = (i * 0.05) + 's';
				article.innerHTML = '<a href="' + imgUrl(img) + '" target="_blank"><img src="' + imgUrl(img) + '" /></a>';
				main.appendChild(article);
			});
			requestAnimationFrame(() => {
				document.querySelectorAll('.thumb').forEach(el => el.classList.add('loaded'));
			});
		})
		.catch(err => {
			document.getElementById('main').innerHTML = '<div style="color:#fff;text-align:center;padding:40px;">加载失败: ' + err.message + '</div>';
		});
	</script>
</body>
</html>
